services:
  postgres:
    image: postgres:16-alpine
    container_name: cfo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cfo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cfo_password}
      POSTGRES_DB: ${POSTGRES_DB:-cfo_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cfo_user} -d ${POSTGRES_DB:-cfo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cfo_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cfo_user}:${POSTGRES_PASSWORD:-cfo_password}@postgres:5432/${POSTGRES_DB:-cfo_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-cfo_user}:${POSTGRES_PASSWORD:-cfo_password}@postgres:5432/${POSTGRES_DB:-cfo_db}
      - APP_ENV=development
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cfo_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
