name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install aiosqlite

      - name: Compile check
        run: python -m compileall -q app

      - name: Import check
        run: python -c "import app.main"

      - name: Run test scripts
        run: |
          set -e
          files=$(find . -name 'test_*.py' -not -path './alembic/*' -not -path './tests/*')
          if [ -z "$files" ]; then
            echo "No test files found"
            exit 0
          fi
          for f in $files; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
