name: Release

on:
  push:
    tags: ["v*"]

jobs:
  backend:
    name: Backend tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cfo_user
          POSTGRES_PASSWORD: cfo_password
          POSTGRES_DB: cfo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cfo_user -d cfo_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://cfo_user:cfo_password@localhost:5432/cfo_db
      SYNC_DATABASE_URL: postgresql+psycopg2://cfo_user:cfo_password@localhost:5432/cfo_db
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint (syntax errors and undefined names)
        run: ruff check app --select E9,F63,F7,F82

      - name: Apply migrations on an empty database
        run: alembic upgrade head

      - name: API tests
        run: python -m pytest -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cfo-backend:${{ github.ref_name }} backend

      - name: Build frontend image
        run: docker build -t cfo-frontend:${{ github.ref_name }} frontend

  release:
    name: GitHub Release
    needs: [backend, frontend, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release with deployment notes and generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --notes-file .github/release-notes.md --verify-tag
